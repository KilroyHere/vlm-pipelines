[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "roomlayout"
version = "0.1.0"
description = "Room layout pipeline: scanned rooms + generated furniture assets -> constraint-satisfying layouts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
solver = [
    "shapely>=2.0",
    "matplotlib>=3.8",
]
assets = [
    "trimesh>=4.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roomlayout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
